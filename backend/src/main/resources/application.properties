spring.datasource.url=jdbc:mysql://localhost:3306/trustvault
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
trustvault.storage-root=${STORAGE_ROOT:/var/trustvault/files}
trustvault.jwt-secret=${JWT_SECRET}
trustvault.jwt-ttl-minutes=15
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
