spring.datasource.url=jdbc:mysql://localhost:3306/trustvault
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
trustvault.storage-root=${STORAGE_ROOT:/var/trustvault/files}
trustvault.jwt-secret=${JWT_SECRET}
trustvault.jwt-ttl-minutes=15
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true
# Development only: trust the Brevo certificate when a local network tool replaces it.
# Remove this line before deployment, so the mail connection is fully verified on the live server.
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
trustvault.mail-from=${MAIL_FROM:}