<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eeec" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e9eeec" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#1c2326"/>

  <!-- stacked sheets, slightly rotated -->
  <g fill="url(#sheet)" stroke="#cfd8d5" stroke-width="1.2" stroke-opacity="0.35">
    <g transform="rotate(-6 600 450)">
      <rect x="250" y="120" width="520" height="680"/>
    </g>
    <g transform="rotate(3 600 450)">
      <rect x="330" y="160" width="520" height="680"/>
    </g>
    <g transform="rotate(-1 600 450)">
      <rect x="410" y="200" width="520" height="680"/>
    </g>
  </g>

  <!-- text lines on the front sheet -->
  <g stroke="#cfd8d5" stroke-width="2" stroke-opacity="0.22" stroke-linecap="round">
    <line x1="460" y1="290" x2="860" y2="290"/>
    <line x1="460" y1="330" x2="820" y2="330"/>
    <line x1="460" y1="370" x2="860" y2="370"/>
    <line x1="460" y1="410" x2="780" y2="410"/>
    <line x1="460" y1="470" x2="860" y2="470"/>
    <line x1="460" y1="510" x2="840" y2="510"/>
    <line x1="460" y1="550" x2="700" y2="550"/>
  </g>

  <!-- a single restricted mark: a stamp outline -->
  <g fill="none" stroke="#8fb5b7" stroke-width="3" stroke-opacity="0.35">
    <rect x="740" y="620" width="150" height="56" rx="2"/>
  </g>

  <!-- ledger rule lines across the whole background -->
  <g stroke="#3d4a4f" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
  </g>
</svg>